name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tuxevil_benchmark
          POSTGRES_USER: tuxevil_benchmark
          POSTGRES_PASSWORD: tuxevil_benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuxevil_benchmark -d tuxevil_benchmark"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply PostgreSQL schema
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://tuxevil_benchmark:tuxevil_benchmark@localhost:5432/tuxevil_benchmark
      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://tuxevil_benchmark:tuxevil_benchmark@localhost:5432/tuxevil_benchmark
          REDIS_URL: redis://localhost:6379
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
